version: '3.8'

services:
  api:
    build: ./app
    container_name: api_herramientas
    restart: always
    ports:
      - "5050:5050"
    environment:
      - DB_HOST=db
      - DB_NAME=toolScan_db
      - DB_USER=admin
      - DB_PASS=admin123
    depends_on:
      - db
    volumes:
      - ./app/imagenes_base:/app/imagenes_base

  db:
    image: postgres:13
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: toolScan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
